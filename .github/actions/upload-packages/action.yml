name: Upload architecture packages
description: Upload one temporary artifact per architecture and OpenWrt branch
inputs:
  branch:
    description: OpenWrt branch
    required: true
  retention-days:
    description: Artifact retention in days
    required: true
runs:
  using: composite
  steps:
    - name: Upload arm_cortex-a5_vfpv4
      uses: actions/upload-artifact@v7
      with:
        name: nikki-rs_arm_cortex-a5_vfpv4-${{ inputs.branch }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0
        if-no-files-found: ignore
        path: .package-output/release/nikki-rs_arm_cortex-a5_vfpv4-${{ inputs.branch }}.tar.gz
    - name: Upload arm_cortex-a7_neon-vfpv4
      uses: actions/upload-artifact@v7
      with:
        name: nikki-rs_arm_cortex-a7_neon-vfpv4-${{ inputs.branch }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0
        if-no-files-found: ignore
        path: .package-output/release/nikki-rs_arm_cortex-a7_neon-vfpv4-${{ inputs.branch }}.tar.gz
    - name: Upload arm_cortex-a8_vfpv3
      uses: actions/upload-artifact@v7
      with:
        name: nikki-rs_arm_cortex-a8_vfpv3-${{ inputs.branch }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0
        if-no-files-found: ignore
        path: .package-output/release/nikki-rs_arm_cortex-a8_vfpv3-${{ inputs.branch }}.tar.gz
