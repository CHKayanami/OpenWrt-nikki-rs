      with:
        name: nikki-rs_arm_cortex-a9-${{ inputs.branch }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0
        if-no-files-found: ignore
        path: .package-output/release/nikki-rs_arm_cortex-a9-${{ inputs.branch }}.tar.gz
    - name: Upload arm_cortex-a9_vfpv3-d16
      uses: actions/upload-artifact@v7
      with:
        name: nikki-rs_arm_cortex-a9_vfpv3-d16-${{ inputs.branch }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0
        if-no-files-found: ignore
        path: .package-output/release/nikki-rs_arm_cortex-a9_vfpv3-d16-${{ inputs.branch }}.tar.gz
    - name: Upload arm_cortex-a9_neon
