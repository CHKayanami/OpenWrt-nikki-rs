name: build-packages

on:
  workflow_dispatch:
    inputs:
      update_core:
        description: Update clash-rs to the latest release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/package.yml
    with:
      update_core: ${{ inputs.update_core || false }}
      upload_feed: false
      artifact_retention_days: 1
