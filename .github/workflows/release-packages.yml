name: release-packages

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  packages:
    uses: ./.github/workflows/package.yml
    with:
      sign: true
      upload_feed: true
      artifact_retention_days: 7
    secrets: inherit

  release:
    needs: packages
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nikki-rs_*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*.tar.gz

  feed:
    needs: [packages, release]
    if: ${{ !cancelled() && needs.packages.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    name: feed
    runs-on: ubuntu-latest

    steps:
      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: feed_nikki_rs_*
          merge-multiple: true
      
      - name: uncompress
        run: |
          for file in feed_nikki_rs_*.tar.gz; do tar -x -z -f "$file"; done
      
      - name: prepare
        run: |
          echo "${{ secrets.KEY_BUILD_PUB }}" > public/key-build.pub
          echo "${{ secrets.PUBLIC_KEY }}" > public/public-key.pem
          tree --dirsfirst --sort name -P '*.apk|*.ipk' --prune --noreport -H "" -T "Nikki RS Feed" --charset utf-8 -o public/index.html public
          sed -i '/<p class="VERSION">/,/<\/p>/d' public/index.html

      - name: feed
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=nikki-rs
