config status 'status'

config config 'config'
	option init '1'
	option enabled '0'
	option profile 'file:default.yaml'
	option start_delay '0'
	option scheduled_restart '0'
	option scheduled_restart_cron '0 3 * * *'
	option test_profile '0'
	option core_only '0'

config procd 'procd'
	option fast_reload '0'
	option rlimit_nofile_soft '65536'
	option rlimit_nofile_hard '65536'

config core 'core'
	option redirect_listener_name 'redir-in'
	option tproxy_listener_name 'tproxy-in'
	option tun_listener_name 'tun-in'

config subscription 'subscription'
	option name 'default'
	option url 'http://example.com/default.yaml'
	option user_agent 'clash'
	option prefer 'remote'
	option success '0'

config mixin 'mixin'
	option log_level 'warning'
	option mode 'rule'
	option match_process 'off'
	option ui_internal '1'
	option api_listen '[::]:9999'
	option allow_lan '1'
	option mixed_port '7890'
	option tproxy_port '7892'
	option authentication '0'
	option tun_dns_hijack '0'
	list tun_dns_hijacks 'tcp://any:53'
	list tun_dns_hijacks 'udp://any:53'
	option dns_enabled '1'
	option dns_listen '[::]:1053'
	option dns_ipv6 '1'
	option dns_mode 'fake-ip'
	option fake_ip_range '198.18.0.1/16'
	option fake_ip_filter '1'
	option hosts '1'
	option dns_nameserver '1'
	option dns_nameserver_policy '0'
	option rule '0'
	option rule_provider '1'
	option mixin_file_content '0'
	option dns_proxy_server_nameserver_policy '0'
	option proxy_node '1'
	option rule_provider_scheduled_update '1'
	option rule_provider_scheduled_update_cron '0 3 * * 0'
	option ipv6 '1'
	option api_secret '123456'
	option fake_ip6_range 'fc00::/18'
	option fake_ip_ttl '1'
	list fake_ip_filters '+.lan'
	list fake_ip_filters '+.local'
	list fake_ip_filters 'rule-set:geosite-cn'
	list fake_ip_filters 'rule-set:apple-cn'
	option dns_hosts '1'
	option black_filter '1'
	list black_filters 'rule-set:ads'
	option dnsmasq_hosts '1'

config authentication
	option enabled '1'
	option username 'nikki-rs'
	option password '123456'

config hosts
	option enabled '0'
	option domain_name 'localhost'
	list ip '127.0.0.1'
	list ip '::1'

config nameserver
	option enabled '1'
	option type 'default-nameserver'
	list nameserver '223.5.5.5'

config nameserver
	option enabled '1'
	option type 'nameserver'
	list nameserver '223.5.5.5'



config proxy 'proxy'
	option enabled '1'
	option tcp_mode 'tproxy'
	option udp_mode 'tproxy'
	option ipv4_dns_hijack '1'
	option ipv6_dns_hijack '1'
	option ipv4_proxy '1'
	option ipv6_proxy '1'
	option fake_ip_ping_hijack '0'
	option router_proxy '0'
	option lan_proxy '1'
	list lan_inbound_interface 'lan'
	list reserved_ip '0.0.0.0/8'
	list reserved_ip '10.0.0.0/8'
	list reserved_ip '127.0.0.0/8'
	list reserved_ip '100.64.0.0/10'
	list reserved_ip '169.254.0.0/16'
	list reserved_ip '172.16.0.0/12'
	list reserved_ip '192.168.0.0/16'
	list reserved_ip '224.0.0.0/4'
	list reserved_ip '240.0.0.0/4'
	list reserved_ip6 '::/128'
	list reserved_ip6 '::1/128'
	list reserved_ip6 '::ffff:0:0/96'
	list reserved_ip6 '100::/64'
	list reserved_ip6 '64:ff9b::/96'
	list reserved_ip6 '2001::/32'
	list reserved_ip6 '2001:10::/28'
	list reserved_ip6 '2001:20::/28'
	list reserved_ip6 '2001:db8::/32'
	list reserved_ip6 '2002::/16'
	list reserved_ip6 'fc00::/7'
	list reserved_ip6 'fe80::/10'
	list reserved_ip6 'ff00::/8'
	list bypass_dscp '4'
	option bypass_china_mainland_ip '1'
	option bypass_china_mainland_ip6 '1'
	option only_proxy_fake_ip_and_whitelist '0'
	option proxy_tcp_dport '0-65535'
	option proxy_udp_dport '0-65535'
	option tun_timeout '30'
	option tun_interval '1'
	option china_mainland_ip_url 'https://raw.githubusercontent.com/juewuy/ShellCrash/update/bin/geodata/china_ip_list.txt'
	option china_mainland_ip6_url 'https://raw.githubusercontent.com/juewuy/ShellCrash/update/bin/geodata/china_ipv6_list.txt'

config router_access_control
	option enabled '1'
	list user 'dnsmasq'
	list user 'ftp'
	list user 'logd'
	list user 'nobody'
	list user 'ntp'
	list user 'ubus'
	list group 'dnsmasq'
	list group 'ftp'
	list group 'logd'
	list group 'nogroup'
	list group 'ntp'
	list group 'ubus'
	list cgroup 'services/adguardhome'
	list cgroup 'services/aria2'
	list cgroup 'services/dnsmasq'
	list cgroup 'services/netbird'
	list cgroup 'services/qbittorrent'
	list cgroup 'services/sysntpd'
	list cgroup 'services/tailscale'
	list cgroup 'services/zerotier'
	option dns '0'
	option proxy '0'

config router_access_control
	option enabled '1'
	option dns '1'
	option proxy '1'

config lan_access_control
	option enabled '1'
	option dns '1'
	option proxy '1'

config routing 'routing'
	option tproxy_fw_mark '0x82'
	option tproxy_fw_mask '0xFF'
	option tun_fw_mark '0x83'
	option tun_fw_mask '0xFF'
	option tproxy_rule_pref '1026'
	option tun_rule_pref '1027'
	option tproxy_route_table '82'
	option tun_route_table '83'
	option cgroup_id '0x12071207'
	option cgroup_name 'nikki-rs'
	option dummy_device 'nikki-rs-dummy'

config editor 'editor'

