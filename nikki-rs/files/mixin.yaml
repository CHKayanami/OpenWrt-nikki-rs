# Mixin File
# You can set any clash-rs profile's config at here, it will mixin to the profile.
# Mixin file have lower priority than the LuCI mixin options.
#
# clash-rs full config example: https://github.com/CHKayanami/clash-rs/blob/master/clash-bin/tests/data/config/full.yaml
#
# For example:
#
# listeners: # overwrite listeners
#   - name: shadowsocks
#     type: shadowsocks
#     listen: "::"
#     port: 12060
# proxies: # prepend proxies
#   - name: PROXY
#     type: ss
#     server: proxy.example.com
#     port: 443
#     cipher: chacha20-ietf-poly1305
#     password: password
# proxy-groups: # prepend proxy groups
#   - name: PROXY_GROUP
#     type: select
#     proxies:
#       - PROXY
# rules: # prepend rules
#   - DOMAIN,direct.example.com,DIRECT
#   - DOMAIN-SUFFIX,proxy.example.com,PROXY